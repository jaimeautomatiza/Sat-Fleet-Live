<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- SatFleet Live ISS icon: truss, 8 solar arrays and central modules. Brand purple #9c27b0 -->
  <g stroke="#1a0b22" stroke-width="1.2" stroke-linejoin="round">
    <!-- solar arrays (top and bottom, two pairs per side) -->
    <g fill="#9c27b0">
      <rect x="5" y="6" width="7" height="22" rx="1"/>
      <rect x="14" y="6" width="7" height="22" rx="1"/>
      <rect x="43" y="6" width="7" height="22" rx="1"/>
      <rect x="52" y="6" width="7" height="22" rx="1"/>
      <rect x="5" y="36" width="7" height="22" rx="1"/>
      <rect x="14" y="36" width="7" height="22" rx="1"/>
      <rect x="43" y="36" width="7" height="22" rx="1"/>
      <rect x="52" y="36" width="7" height="22" rx="1"/>
    </g>
    <!-- main truss -->
    <rect x="3" y="29.5" width="58" height="5" rx="1.5" fill="#f2e6f7"/>
    <!-- pressurised modules -->
    <rect x="27.5" y="16" width="9" height="32" rx="3" fill="#ffffff"/>
    <rect x="23" y="24" width="18" height="7" rx="2.5" fill="#ffffff"/>
  </g>
  <!-- panel cell lines -->
  <g stroke="#e0aaff" stroke-width="0.8" opacity="0.7">
    <path d="M5 13h7M5 20h7M14 13h7M14 20h7M43 13h7M43 20h7M52 13h7M52 20h7"/>
    <path d="M5 44h7M5 51h7M14 44h7M14 51h7M43 44h7M43 51h7M52 44h7M52 51h7"/>
  </g>
</svg>
